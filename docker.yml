---
- name: install docker
  hosts: servers
  become: yes

  tasks:
  - name: install docker
    apt:
      name:
        - docker.io
        - docker-compose-v2
      state: present
      update_cache: yes

  - name: start docker
    service:
      name: docker
      state: started
      enabled: yes

- name: start exporters
  hosts: webservers
  become: yes

  tasks:
  - name: copy docker compose
    copy:
      src: docker-compose.yml
      dest: /home/user/docker-compose.yml

  - name: copy nginxlog config
    copy:
      src: nginxlog.hcl
      dest: /home/user/nginxlog.hcl

  - name: start exporters
    command: docker compose up -d node-exporter nginxlog-exporter
    args:
      chdir: /home/user

- name: start prometheus
  hosts: prometheus
  become: yes

  tasks:
  - name: copy docker compose
    copy:
      src: docker-compose.yml
      dest: /home/user/docker-compose.yml

  - name: copy prometheus config
    copy:
      src: prometheus.yml
      dest: /home/user/prometheus.yml

  - name: start prometheus
    command: docker compose up -d prometheus
    args:
      chdir: /home/user

- name: start grafana
  hosts: grafana
  become: yes

  tasks:
  - name: copy docker compose
    copy:
      src: docker-compose.yml
      dest: /home/user/docker-compose.yml

  - name: start grafana
    command: docker compose up -d grafana
    args:
      chdir: /home/user

- name: start elasticsearch
  hosts: elasticsearch
  become: yes

  tasks:
  - name: set vm max map count
    sysctl:
      name: vm.max_map_count
      value: '262144'
      state: present

  - name: copy docker compose
    copy:
      src: docker-compose.yml
      dest: /home/user/docker-compose.yml

  - name: start elasticsearch
    command: docker compose up -d elasticsearch
    args:
      chdir: /home/user

- name: start kibana
  hosts: kibana
  become: yes

  tasks:
  - name: copy docker compose
    copy:
      src: docker-compose.yml
      dest: /home/user/docker-compose.yml

  - name: start kibana
    command: docker compose up -d kibana
    args:
      chdir: /home/user

- name: start filebeat
  hosts: webservers
  become: yes

  tasks:
  - name: copy docker compose
    copy:
      src: docker-compose.yml
      dest: /home/user/docker-compose.yml

  - name: copy filebeat config
    copy:
      src: filebeat.yml
      dest: /home/user/filebeat.yml

  - name: start filebeat
    command: docker compose up -d filebeat
    args:
      chdir: /home/user