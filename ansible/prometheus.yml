global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets:
          - "{{ hostvars[groups['webservers'][0]].ansible_host }}:9100"
          - "{{ hostvars[groups['webservers'][1]].ansible_host }}:9100"

  - job_name: nginx
    static_configs:
      - targets:
          - "{{ hostvars[groups['webservers'][0]].ansible_host }}:4040"
          - "{{ hostvars[groups['webservers'][1]].ansible_host }}:4040"