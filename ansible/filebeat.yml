filebeat.inputs:
  - type: filestream
    id: nginx-access
    enabled: true
    paths:
      - /var/log/nginx/access.log

  - type: filestream
    id: nginx-error
    enabled: true
    paths:
      - /var/log/nginx/error.log

output.elasticsearch:
  hosts:
    - "http://{{ hostvars[groups['elasticsearch'][0]].ansible_host }}:9200"